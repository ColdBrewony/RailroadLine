# 테스트는 로컬 개발용 파일 DB(data/railroad-db.*)를 절대 건드리면 안 되므로 별도의
# 인메모리 DB를 쓴다. DataSeeder가 시작할 때마다 전체 재적재하도록 바뀐 뒤로, 테스트가
# src/main/resources의 설정을 그대로 물려받으면 로컬 개발 DB가 테스트 실행마다 지워지는
# 문제가 있었다.
spring.datasource.url=jdbc:h2:mem:railroad-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
