<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>철도 노선도</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="search-bar">
    <button id="menu-toggle" type="button" aria-label="노선 목록 열기">☰</button>
    <div id="search-box">
      <input
        id="search-input"
        type="text"
        placeholder="역 이름 검색..."
        autocomplete="off"
        aria-autocomplete="list"
      />
      <ul id="search-results" role="listbox" hidden></ul>
    </div>
  </header>

  <div id="layout">
    <aside id="line-list-sidebar">
      <div id="line-list-tabs"></div>
      <ul id="line-list"></ul>
    </aside>

    <div id="sidebar-backdrop" hidden></div>

    <main id="diagram-view">
      <svg id="diagram-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <button id="legend-toggle" type="button">범례</button>
      <div id="legend" hidden>
        <h3>범례</h3>
        <ul>
          <li><span class="legend-swatch legend-swatch-normal"></span> 일반역</li>
          <li><span class="legend-swatch legend-swatch-transfer"></span> 환승·분기역</li>
          <li><span class="legend-swatch legend-swatch-selected"></span> 선택된 역</li>
        </ul>
        <p class="legend-note">
          노선마다 선 색이 자동으로 다르게 배정됩니다. 역 종류(관리역·무인역 등)와 KTX 정차 여부는
          역을 클릭하면 오른쪽(모바일은 하단) 상세 패널에서 확인할 수 있습니다.
        </p>
      </div>
    </main>

    <aside id="station-detail-panel" hidden>
      <div id="detail-drag-handle" aria-hidden="true"></div>
      <button id="detail-close" type="button" aria-label="닫기">✕</button>
      <div id="detail-content"></div>
    </aside>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
