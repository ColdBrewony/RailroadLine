spring.application.name=railroad

server.port=8090

# H2 file-mode database (data persists under ./data/railroad-db.*)
spring.datasource.url=jdbc:h2:file:./data/railroad-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console for local inspection (http://localhost:8090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
